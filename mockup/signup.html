<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新規登録 | SnsTimeLineApp モックアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<div class="mock-banner"><span class="screen-id">SC-02</span>モックアップ（表示イメージ確認用・実データではありません）</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">◉</div>
    <h1>アカウントを作成</h1>
    <p class="lead">登録するとそのままログインします</p>

    <form onsubmit="event.preventDefault(); location.href='timeline.html';">
      <div class="form-field">
        <label class="required" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" value="taro@example.com">
      </div>

      <div class="form-field">
        <label class="required" for="username">ユーザー名</label>
        <input class="input" type="text" id="username" value="taro_123" maxlength="30">
        <!-- 入力中に @ プレフィックス付きでプレビュー表示（docs SC-02） -->
        <div class="field-hint">プレビュー: <strong id="username-preview">@taro_123</strong>　半角英数字とアンダースコアのみ／3〜30文字</div>
      </div>

      <div class="form-field">
        <label class="required" for="displayName">表示名</label>
        <input class="input" type="text" id="displayName" value="たろう" maxlength="50">
        <div class="field-hint">1〜50文字。日本語が使えます</div>
      </div>

      <div class="form-field">
        <label class="required" for="password">パスワード</label>
        <input class="input is-error" type="password" id="password" value="pass">
        <!-- バリデーションエラーは該当フィールドの直下に赤字（docs 8章） -->
        <div class="field-error">
          <span>⚠️</span><span>パスワードは8文字以上で、英字と数字を含めてください</span>
        </div>
      </div>

      <div class="form-field">
        <label class="required" for="passwordConfirm">パスワード（確認）</label>
        <input class="input" type="password" id="passwordConfirm" value="">
      </div>

      <button class="btn btn-accent btn-block" type="submit">登録する</button>
    </form>

    <div class="auth-footer">
      すでにアカウントをお持ちの方は<br>
      <a href="login.html">→ ログイン</a>
    </div>
  </div>
</div>

<div class="note-box" style="max-width:420px;margin:0 auto 40px;">
  <strong>モック補足</strong><br>
  パスワード欄のエラーは<strong>バリデーションエラーの見た目を確認するために常時表示</strong>しています。<br>
  一意制約違反（409）は「このメールアドレスは既に登録されています」「このユーザー名は既に使われています」を
  <strong>フィールド単位</strong>で同じ形式で表示します。
</div>

<script src="mock.js"></script>
<script>
  // ユーザー名の @ プレビュー
  const input = document.getElementById('username');
  const preview = document.getElementById('username-preview');
  input.addEventListener('input', () => {
    preview.textContent = '@' + (input.value || 'username');
  });
</script>
</body>
</html>
