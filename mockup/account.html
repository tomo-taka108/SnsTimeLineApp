<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アカウント設定 | SnsTimeLineApp モックアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<div class="mock-banner"><span class="screen-id">SC-11</span>モックアップ（Phase2 / 表示イメージ確認用）</div>

<header class="app-header">
  <a class="logo" href="timeline.html"><span class="logo-mark">◉</span>SnsTimeLine</a>
  <div class="header-actions">
    <a class="icon-btn" href="search.html" title="ユーザー検索">🔍</a>
    <div class="avatar-menu">
      <button class="avatar-menu-trigger" type="button" data-menu-trigger>
        <span class="avatar avatar-sm" style="background:#1d9bf0">た</span>
        <span class="caret">▼</span>
      </button>
      <div class="dropdown" data-menu>
        <a href="profile-me.html">👤 プロフィール</a>
        <a href="profile-edit.html">⚙️ 設定</a>
        <div class="divider"></div>
        <a href="login.html">🚪 ログアウト</a>
      </div>
    </div>
  </div>
</header>

<main class="app-main">

  <div class="back-bar">
    <a class="icon-btn" href="profile-edit.html" aria-label="戻る">←</a>
    <span class="title">アカウント設定</span>
  </div>

  <div style="padding:20px 16px;">

    <div class="form-field">
      <label for="email">メールアドレス</label>
      <input class="input" type="email" id="email" value="taro@example.com" disabled>
      <div class="field-hint">メールアドレスは変更できません</div>
    </div>

    <div class="divider-thick" style="margin:24px -16px;"></div>

    <h2 style="font-size:17px;margin:0 0 16px;">パスワードを変更</h2>

    <form onsubmit="event.preventDefault(); showToast('パスワードを変更しました');">
      <div class="form-field">
        <label class="required" for="current">現在のパスワード</label>
        <input class="input" type="password" id="current" placeholder="現在のパスワードを入力">
      </div>

      <div class="form-field">
        <label class="required" for="next">新しいパスワード</label>
        <input class="input" type="password" id="next" placeholder="新しいパスワードを入力">
        <div class="field-hint">8文字以上。英字と数字を各1文字以上含めてください</div>
      </div>

      <div class="form-field">
        <label class="required" for="confirm">新しいパスワード（確認）</label>
        <input class="input" type="password" id="confirm" placeholder="もう一度入力">
      </div>

      <button class="btn btn-accent" type="submit">パスワードを変更</button>
    </form>

    <div class="note-box" style="margin:24px 0 0;">
      <strong>設計上のポイント</strong><br>
      パスワード変更後も<strong>ログアウトはさせません</strong>。
      本アプリのJWTは失効管理をしないため、発行済みのトークンはそのまま有効です。
    </div>

  </div>

</main>

<script src="mock.js"></script>
</body>
</html>
