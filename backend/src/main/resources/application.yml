spring:
  application:
    name: snstimeline

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snstimeline}
    username: ${DB_USERNAME:snsapp}
    password: ${DB_PASSWORD:password}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      # Spring の既定 1MB では app.upload.max-size-mb（5MB）に届く前に弾かれる。
      # ここを「アプリの上限＋余裕」にしておき、5MB超の判定は FileService に任せる
      # （そちらの方が 413 とエラーコードを設計どおりに返せる）。
      # この値は最後の防波堤で、極端に巨大なリクエストを Tomcat の段階で切るためのもの
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    # スタックトレース・例外メッセージをクライアントに返さない
    # （docs/06_non_functional.md 3.8）
    include-stacktrace: never
    include-message: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # display_name -> displayName のようにスネークケース列名を自動変換する。
    # 注意: JPA の ddl-auto=validate に相当する「起動時のスキーマ整合チェック」は
    #       MyBatis には無い。カラム名を誤ると起動は成功し、値が黙って null になる。
    map-underscore-to-camel-case: true

app:
  jwt:
    # 既定値を置かない。未設定なら起動を失敗させる（docs/06_non_functional.md 3.2）
    secret: ${JWT_SECRET}
    # アクセストークン（JWT）は短命にする。失効させられないため、
    # 漏洩時の被害時間は有効期限がそのまま上限になる（D-29）
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    # リフレッシュトークンは長命だが、DBで失効できる
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  cors:
    # ワイルドカードは使わない（docs/05_api_design.md 7章）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # LOCAL / S3。この1行で保存先が切り替わる（docs/07_architecture.md 3.3）。
    # 既定を LOCAL にして、AWSアカウントが無くても開発できる状態を保つ
    # （docs/10_infrastructure.md 5章）
    type: ${APP_STORAGE_TYPE:LOCAL}
    local-path: ${APP_STORAGE_LOCAL_PATH:./uploads}
    s3:
      # type=S3 のときだけ使う。認証情報はここに書かず、AWS SDK の既定の
      # 探索順（環境変数 → …… → IAMロール）に委ねる（docs/10_infrastructure.md 4.5）
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:ap-northeast-1}
  upload:
    max-size-mb: ${APP_UPLOAD_MAX_SIZE_MB:5}
    max-count: ${APP_UPLOAD_MAX_COUNT:1}

logging:
  level:
    root: INFO
    com.example.snstimeline: INFO
    org.flywaydb: INFO
