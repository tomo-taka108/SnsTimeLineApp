spring:
  application:
    name: snstimeline

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snstimeline}
    username: ${DB_USERNAME:snsapp}
    password: ${DB_PASSWORD:password}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    # スタックトレース・例外メッセージをクライアントに返さない
    # （docs/06_non_functional.md 3.8）
    include-stacktrace: never
    include-message: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # display_name -> displayName のようにスネークケース列名を自動変換する。
    # 注意: JPA の ddl-auto=validate に相当する「起動時のスキーマ整合チェック」は
    #       MyBatis には無い。カラム名を誤ると起動は成功し、値が黙って null になる。
    map-underscore-to-camel-case: true

app:
  jwt:
    # 既定値を置かない。未設定なら起動を失敗させる（docs/06_non_functional.md 3.2）
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    # ワイルドカードは使わない（docs/05_api_design.md 7章）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.example.snstimeline: INFO
    org.flywaydb: INFO
