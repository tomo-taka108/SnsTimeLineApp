# CI（docs/09_decision_log.md D-77）。
#
# quality-check スキルの Step 1〜6 と、e2e-test スキルのシナリオテストを PR ごとに実行する。
# パフォーマンステスト（k6 / ブラウザperf）は数値の意味が実行環境に強く依存するため対象外
# （D-69・D-76。共有ランナーでは他ジョブとCPUを分け合い、相対比較の基準にならない）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同じブランチに連続でpushしたとき、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # quality-check Step 1〜3（Spotless・コンパイル・JUnit）
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # spotless:check は verify フェーズに紐付いていないため明示的に並べる。
      # Testcontainers（postgres:16）はランナー標準の Docker をそのまま使う
      - run: ./mvnw -B spotless:check verify

  # quality-check Step 4〜6（oxlint・型チェック・Vitest・ビルド）
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # -p tsconfig.app.json を省くと参照専用の tsconfig.json を見て空振りする（quality-check Step 5）
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  # e2e-test スキルのシナリオテスト。静的解析・単体テストで落ちるコードに数分かけないよう後段に置く
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5434/snstimeline_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # 掃除処理（globalSetup の truncateAll と run-e2e.sh の trap）が
      # `docker compose exec db-e2e` 前提のため、services: ではなく compose を使う
      - name: E2E用DBを起動する
        run: docker compose --profile e2e up -d --wait db-e2e

      # テストは backend ジョブで実行済み。spring-boot:run より軽く本番に近い jar で起動する
      - name: バックエンドをビルドする
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      # JWT_SECRET はジョブ内で使い捨てにする。ログに出さないため add-mask で伏せる（CLAUDE.md 6章）
      - name: バックエンドを起動する
        working-directory: backend
        run: |
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::${secret}"
          JWT_SECRET="$secret" \
          DB_URL="$E2E_DB_URL" \
          CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            nohup java -jar target/snstimeline-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: フロントエンドを起動する
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev > "$RUNNER_TEMP/frontend.log" 2>&1 &

      # ヘルスチェック用エンドポイントが未定義のため（10_infrastructure 4.1）、
      # run-e2e.sh と同じく POST /auth/login が応答するかで起動完了を判定する
      - name: 起動を待つ
        run: |
          for _ in $(seq 1 90); do
            api="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' -d '{}' || true)"
            web="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:5173/login || true)"
            if [ "$api" != "000" ] && [ "$web" != "000" ]; then
              echo "起動完了（api=${api} web=${web}）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::バックエンドまたはフロントエンドが180秒以内に起動しなかった"
          exit 1

      - name: E2Eの依存関係とブラウザを入れる
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      # 事前チェック・前後の掃除を含めて既存スクリプトをそのまま使う
      - name: E2Eシナリオテストを実行する
        run: ./e2e/run-e2e.sh

      - name: 失敗時の調査材料を保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/results/
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          retention-days: 7
